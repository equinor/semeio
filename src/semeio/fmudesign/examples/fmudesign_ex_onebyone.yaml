  comments:
    A1:
      text: Name for sensitivity. Will show up in SENSNAME column in design matrix. For tornado plots
        each SENSNAME will correspond to a bar in the tornado plot. Can contain one/two senscases for
        a scenario sensitivity or alternatively one monte carlo sensitivity with one or several parameters
        specified by dist_name(s) and parameters.
      author: ' '
    B1:
      text: 'Optional columns in grey text.

        Numreal: number of realisations per sensitivity/scenario.

        Overwrites number of realisations from ''repeats'' in general_input sheet.'
      author: ' '
    C1:
      text: "seed: only seed is varying. Other parameters are set to default, or specified with dist_name\
        \ = const\nscenario: one or two alternative cases (with/without repeated seeds). Use with senscase/value\n\
        dist: parameters sampled from distributions, use with dist_name and dist_param1\u2026\nref: single\
        \ realisation with parameter values set to default values\n\nAdvanced options:\nbackground: parameter\
        \ values set to default values, except set of background parameters that are varied\nextern: parameter\
        \ values read from an external file, typically createed in another software"
      author: ' '
    E1:
      text: name of first alternative scenario. Will show up in SENSCASE column in design matrix
      author: ' '
    F1:
      text: parameter value(s) for first alternative scenario
      author: ' '
    G1:
      text: name of 2nd alternative scenario. Will show up in SENSCASE column in design matrix
      author: ' '
    H1:
      text: parameter value(s) for first alternative scenario
      author: ' '
    I1:
      text: 'Available distributions (dist_name) and dist_params in order:

        normal (mean, std dev)

        normal (mean, std dev, min, max) - truncated normal

        uniform (min, max)

        loguniform (min, max) - give min max of the output variable

        triangular (min, mode, max)

        pert (min, mode, max)

        pert (min, mode, max, concentration_param)

        beta (a, b)

        beta (a, b, min, max)

        discrete ((value1, value2, value3, .. value_n), (weight1, weight2, weight3, weight_n)) - no weights
        give discrete uniform

        lognormal (mu, sigma) - parameters are mean and std dev for the logarithm of the variable

        const (value)


        Bold part of dist_name is sufficient for distribution name, but the whole name can be provided'
      author: ' '
    N1:
      text: 'Optional column:

        For sensitivities of type dist. Will round output numbers to this number of decimals.'
      author: ' '
    O1:
      text: 'Optional column:

        For sensitivities of type dist. Name of sheet with correlation matrix.'
      author: ' '
    P1:
      text: 'Optional column:

        For sensitivities of type extern. Name of file to read parameters from.'
      author: ' '
