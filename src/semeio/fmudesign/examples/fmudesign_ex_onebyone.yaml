version: 1
general:
  repeats: 10
  rms_seeds: default
sensitivities:
- name: rms_seed
  type: seed
- name: faults
  type: scenario
  cases: [east, west]
  parameters:
    FAULT_POSITION: [-1, 1]
- name: velmodel
  type: scenario
  cases: [alternative]
  parameters:
    DC_MODEL: [hum2]
- name: contacts
  type: scenario
  cases: [shallow, deep]
  parameters:
    OWC1: [2600, 2700]
    OWC2: [2700, 2800]
    OWC3: [2800, 2900]
- name: multz
  type: distribution
  realizations: 20
  parameters:
    MULTZ_ILE:
      distribution: logunif
      values: [0.0001, 1]
defaults:
  RMS_SEED: 1000
  FAULT_POSITION: 0
  DC_MODEL: base
  OWC1: 2650
  OWC2: 2750
  OWC3: 2850
  MULTZ_ILE: 0.1
  PARAM1: 100
  PARAM2: 200
  PARAM3: 0.5
include_instructions: true
