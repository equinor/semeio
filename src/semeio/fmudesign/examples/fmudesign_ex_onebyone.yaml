    B2:
      text: Default number of realisations per sensitivity/scenario. Typically > 1 for repeating seeds.
      author: ' '
    B3:
      text: "Alternatives:\n- default: means using RMS_SEED 1000-1001-1002-1003-\u2026\n- None: RMS_SEED\
        \ is not added as parameter in spreadsheet\n- filname for filw with list of seeds (one column)"
      author: ' '
    B4:
      text: 'Advanced option to include sampled background parameters (see documentation).

        Alternatives:

        - None (no sampled background parameters)

        - name of sheet in current workbook containing distributions for background parameters

        - name of external file with background parameters (suffix .xlsx or .csv) Must be readable as
        pandas data frame with parameter names as column headers. Path is relative to where fmudesign
        is run from.'
      author: ' '
    B5:
      text: 'Set RNG seed for "dist" sensitivities

        Alternatives:

        - Integer (e.g. 395830)

        - None (leads to non-reproducible analysis)'
      author: ' '
