version: 1
general:
  repeats: 10
  rms_seeds: default
sensitivities:
- name: rms_seed
  type: seed
  constants:
    COHIBA_MODE: prediction
- name: velmod1
  type: seed
  constants:
    COHIBA_MODE: simulation
    VEL_MODEL: 1
- name: velmod2
  type: seed
  constants:
    COHIBA_MODE: simulation
    VEL_MODEL: 2
- name: vel_combined
  type: distribution
  realizations: 30
  parameters:
    COHIBA_MODE:
      distribution: const
      values: [simulation]
    VEL_MODEL:
      distribution: discrete
      values: ['1, 2', '0.6, 0.4']
defaults:
  RMS_SEED: 1000
  VEL_MODEL: 1
  COHIBA_MODE: prediction
