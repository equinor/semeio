  comments:
    B1:
      text: Specifies that this is a setup for a onebyone design
      author: None
    B2:
      text: "Number of repeated rms_seeds per sensitivity/sensitivity case. \nThis is overridden if the\
        \ number of realisations is specified in the \u201Cnumreal\u201D column in designinput."
      author: None
    B3:
      text: "Alternatives:\n- default gives seed numbers 1000, 1001, 1002, ...\n- None (seed number is\
        \ not added as parameter in output spreadsheet) \n- filename for file with list of seeds in ert/input/distributions/"
      author: None
    B4:
      text: 'Alternatives:

        - None

        - name of sheet in this workbook with background parameters

        - Name of external file with background parameters. Must end with .xlsx or .csv and be readable
        as pandas dataframe with parameter names as column headers. The path can be absolute, or relative
        (to the location of this file)'
      author: None
    B5:
      text: "Seed user for random number generator (RNG). Alternatives:\n - A number (e.g. a six digit\
        \ number like 294284) to see the RNG.\n - None. The RNG will not be seeded and analysis will not\
        \ be reproducible."
      author: None
    B6:
      text: "To correlate variables, an algorithm called Iman-Conover is used.\n- If \u2018correlation_iterations\u2019\
        \ is set to 0, then only Iman-Conover is used.\n- If \u2018correlation_iterations\u2019 is a positive\
        \ integer, then random swaps will be performed to improve the correlation. This takes a bit longer,\
        \ but typically leads to observec orrelation that is closer to desired correlation, especially\
        \ when variables are far from Gaussian (normal distribution). A value of 999 is a good starting\
        \ point."
      author: None
