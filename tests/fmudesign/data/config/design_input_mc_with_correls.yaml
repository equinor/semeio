version: 1
general:
  repeats: 1
  rms_seeds: default
  distribution_seed: 555
sensitivities:
- name: montecarlo
  type: distribution
  realizations: 500
  parameters:
    PARAM1:
      distribution: triang
      values: [0.025, 0.035, 0.045]
      decimals: 3
      correlation: corr1
    PARAM2:
      distribution: norm
      values: [0, 1, -1, 1]
      decimals: 2
      correlation: corr1
    PARAM3:
      distribution: logn
      values: [1, 10]
      decimals: 3
      correlation: corr1
    OWC1:
      distribution: unif
      values: [2500, 2550]
      decimals: 1
      correlation: corr2
    OWC2:
      distribution: triang
      values: [2430, 2470, 2500]
      decimals: 1
      correlation: corr2
    OWC3:
      distribution: triang
      values: [2400, 2450, 2500]
      decimals: 1
      correlation: corr2
    DATO:
      distribution: disc
      values: ['2018-11-02, 2018-11-03, 2018-11-04', '0.3, 0.4, 0.3']
      correlation: corr3
      dependency: depend1
    NTG1:
      distribution: triang
      values: [0.75, 0.8, 1]
      decimals: 2
      correlation: corr3
    NTG2:
      distribution: pert
      values: [0.5, 0.6, 0.65]
      decimals: 2
    FAULTSEAL:
      distribution: logunif
      values: [0.001, 1]
      decimals: 3
defaults:
  RMS_SEED: 1000
  HUM_MODE: PREDICTION
  HUM_METHOD: SIMPLE
  INJ_UNC: 0
  PARAM1: 0.035
  PARAM2: 0.05
  PARAM3: 0.02
  OWC1: 0.001
  OWC2: 0.1
  OWC3: 0.07
  NTG1: 0.25
  NTG2: 0.45
  NTG6: 0.8
  DATO: '2018-11-03'
  FAULTSEAL: 0.01
  DERIVED_PARAM1: 1
  DERIVED_PARAM2: a
correlations:
  corr1:
    parameters: [PARAM1, PARAM2, PARAM3]
    matrix:
    - [1]
    - [0, 1]
    - [0.2, 0, 1]
  corr2:
    parameters: [OWC1, OWC2, OWC3]
    matrix:
    - [1]
    - [0.5, 1]
    - [-0.7, -0.7, 1]
  corr3:
    parameters: [DATO, NTG1]
    matrix:
    - [1]
    - [0.8, 1]
dependencies:
  depend1:
    source: DATO
    values: ['2018-11-02', '2018-11-03', '2018-11-04']
    targets:
      DERIVED_PARAM1: [1, 2, 3]
      DERIVED_PARAM2: [a, b, c]
include_instructions: true
